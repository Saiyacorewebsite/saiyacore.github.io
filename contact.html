<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact – Saiyacore</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to content</a>
    <header class="site-header">
      <a href="index.html" class="brand"
        ><img src="logo.png" alt="Saiyacore" /><span>Saiyacore</span></a
      >
      <!-- ① Hamburger button -->
      <button
        class="menu-btn"
        aria-label="Open menu"
        aria-controls="main-nav"
        aria-expanded="false"
      >
        <span></span><span></span><span></span>
      </button>

      <!-- ② Nav links (unchanged list) -->
      <nav class="main-nav" id="main-nav" aria-label="Main navigation">
        <a href="about.html">About</a>
        <a href="services.html">Services</a>
        <a href="blog.html">Blog</a>
        <a href="contact.html">Contact</a>
      </nav>
    </header>
    <main id="main-content" tabindex="-1">
      <section class="page-banner contact-banner">
        <h1>Let’s Connect</h1>
        <p>Drop us a line—our consultants will respond within 24 hours.</p>
      </section>

      <div class="container page-content fade-up">
        <form
          name="contact"
          method="POST"
          data-netlify="true"
          netlify-honeypot="bot-field"
          class="contact-form"
        >
          <input type="hidden" name="form-name" value="contact" />
          <p class="hidden">
            <label
              >Don’t fill this out if you’re human: <input name="bot-field"
            /></label>
          </p>

          <label
            >Name*
            <input type="text" name="name" required />
          </label>

          <label
            >Email*
            <input type="email" name="email" required />
          </label>

          <label
            >Company
            <input type="text" name="company" />
          </label>

          <label
            >Message*
            <textarea name="message" rows="5" required></textarea>
          </label>

          <button type="submit" class="btn-primary">Send Message</button>
        </form>
      </div>
    </main>
    <footer class="site-footer">
      <p>&copy; 2026 Saiyacore Inc. <span>Cloud. Connected. Ahead.</span></p>
    </footer>
    <script src="scroll-anim.js" defer></script>
  </body>
</html>
